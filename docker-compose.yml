version: "3.8"

services:
  # ========================================================
  # 1. Philo-EverOS Dual RTX 5090 AI Engine (FastAPI)
  # ========================================================
  philo-backend:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: philo-everos-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Dual RTX 5090 (64GB VRAM) Settings
      - GPU_COUNT=2
      - GPU_DEVICES=0,1
      - DEVICE_MAP=auto
      - MODEL_PATH=${MODEL_PATH:-deepseek-ai/DeepSeek-R1-Distill-Qwen-32B}
      - DTYPE=bfloat16
      - ATTN_IMPLEMENTATION=sdpa
      - MAX_MODEL_LEN=16384
      # Auxiliary Model: Volcengine Doubao
      - ARK_API_KEY=${ARK_API_KEY}
      - DOUBAO_ENDPOINT_ID=${DOUBAO_ENDPOINT_ID:-doubao-pro-32k}
      - DOUBAO_BASE_URL=https://ark.cn-beijing.volces.com/api/v3
      # Auxiliary Model: Google Gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      # Vector Database & Cache
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data
      - ~/.everos:/root/.everos
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Passes both RTX 5090 GPUs into container
              capabilities: [gpu]
    depends_on:
      - qdrant
      - redis
    networks:
      - philo-net

  # ========================================================
  # 2. Qdrant Vector Database (EverOS Semantic Memory)
  # ========================================================
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: philo-qdrant-vectordb
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - philo-net

  # ========================================================
  # 3. Redis Cache & Stream Broker
  # ========================================================
  redis:
    image: redis:7.4-alpine
    container_name: philo-redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - philo-net

  # ========================================================
  # 4. Philo-EverOS Web Gateway & UI (Node.js Express)
  # ========================================================
  philo-frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: philo-everos-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PYTHON_BACKEND_URL=http://philo-backend:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ARK_API_KEY=${ARK_API_KEY}
      - DOUBAO_ENDPOINT_ID=${DOUBAO_ENDPOINT_ID}
    volumes:
      - ./data:/app/data
      - ~/.everos:/root/.everos
    depends_on:
      - philo-backend
    networks:
      - philo-net

volumes:
  qdrant_storage:
    driver: local
  redis_data:
    driver: local

networks:
  philo-net:
    driver: bridge
